events {}

http {
    # Fast failover tuning: nginx's *defaults* here (60s connect timeout) are
    # far too slow for a dead backend - without this, a killed replica keeps
    # getting round-robined to and every 3rd request hangs for tens of
    # seconds. max_fails/fail_timeout evict a failing upstream from rotation
    # after a single failure, for 5s.
    upstream movie_app {
        server app1:8000 max_fails=1 fail_timeout=5s;
        server app2:8000 max_fails=1 fail_timeout=5s;
        server app3:8000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://movie_app;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
